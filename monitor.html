<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account Monitor</title>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #111827;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 20px 0;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.balance {
    text-align: center;
}

.amount {
    font-size: 35px;
    font-weight: bold;
    margin-top: 10px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.stat {
    background: #f8fafc;
    padding: 18px;
    border-radius: 12px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 25px;
    margin-top: 8px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #0057d9;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.updated {
    text-align: center;
    color: #667085;
    font-size: 12px;
    margin-top: 12px;
}

</style>
</head>

<body>

<div class="container">

<h1>📊 My Account Monitor</h1>

<div class="card balance">

<h2>Current Balance</h2>

<div class="amount" id="balance">
GH₵100.00
</div>

</div>

<div class="card">

<div class="stats">

<div class="stat">
🎯 Bets
<strong id="bets">0</strong>
</div>

<div class="stat">
✅ Wins
<strong id="wins">0</strong>
</div>

<div class="stat">
❌ Losses
<strong id="losses">0</strong>
</div>

<div class="stat">
💰 Profit
<strong id="profit">GH₵0</strong>
</div>

</div>

</div>

<div class="card">

<button onclick="updateMonitor()">
🔄 Update Monitor
</button>

<div class="updated" id="updated">
Last updated: Not yet
</div>

</div>

</div>

<script>

function updateMonitor() {

    const balance = prompt("Enter your current balance:");

    if (balance === null) return;

    const bets = prompt("Enter total bets:");

    if (bets === null) return;

    const wins = prompt("Enter total wins:");

    if (wins === null) return;

    const losses = prompt("Enter total losses:");

    if (losses === null) return;

    const balanceNumber = Number(balance);
    const betsNumber = Number(bets);
    const winsNumber = Number(wins);
    const lossesNumber = Number(losses);

    if (
        isNaN(balanceNumber) ||
        isNaN(betsNumber) ||
        isNaN(winsNumber) ||
        isNaN(lossesNumber)
    ) {

        alert("Please enter numbers only.");

        return;
    }

    const profit = balanceNumber - 100;

    document.getElementById("balance").innerText =
        "GH₵" + balanceNumber.toFixed(2);

    document.getElementById("bets").innerText =
        betsNumber;

    document.getElementById("wins").innerText =
        winsNumber;

    document.getElementById("losses").innerText =
        lossesNumber;

    document.getElementById("profit").innerText =
        "GH₵" + profit.toFixed(2);

    document.getElementById("updated").innerText =
        "Last updated: " + new Date().toLocaleString();

}

</script>

</body>
</html>
